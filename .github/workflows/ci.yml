name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# 同一ブランチで新しい push が来たら、進行中の古い run を打ち切る。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      # libvips/qpdf の .deb をキャッシュし、毎回のフルダウンロードを避ける（third-party action は使わない）。
      # apt は /var/cache/apt/archives に既存の .deb があれば再ダウンロードしないので、そこへ復元する。
      - name: Restore apt package cache (libvips, qpdf)
        uses: actions/cache@v5
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-libvips-qpdf-v1

      - name: Install packages
        run: |
          sudo mkdir -p /var/cache/apt/archives
          if compgen -G "$HOME/apt-debs/*.deb" > /dev/null; then
            echo "Using cached .deb packages"
            sudo cp "$HOME"/apt-debs/*.deb /var/cache/apt/archives/ || true
          fi
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libvips qpdf
          # 次回のために取得済み .deb を user dir へ退避（archives は world-readable）。
          mkdir -p "$HOME/apt-debs"
          cp /var/cache/apt/archives/*.deb "$HOME/apt-debs/" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  # NOTE: system-test ジョブはシステムテスト（test/system）が無いため削除。
  # 追加したら scaffold のジョブを戻す。
