version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  ignore:
    # kamal は同じホストに同居する別アプリと kamal-proxy を共有しているため、
    # proxy のバージョン整合が要る。自動 bump させず、proxy 更新と歩調を合わせて手動で上げる。
    - dependency-name: "kamal"
    # メジャー昇格は移行作業が要るので自動 bump しない（minor/patch は受ける）。後日まとめて対応。
    - dependency-name: "pagy"
      update-types: ["version-update:semver-major"]
    - dependency-name: "image_processing"
      update-types: ["version-update:semver-major"]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
